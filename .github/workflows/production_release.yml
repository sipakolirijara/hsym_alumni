name: Production Release (APK & AAB)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Cupertino Icons Natively
        run: flutter pub add cupertino_icons

      - name: Add Required Dev Dependencies
        run: |
          flutter pub add --dev flutter_launcher_icons
          flutter pub add --dev change_app_package_name
          flutter pub get

      - name: Apply Custom App Icon
        run: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Rename Package (Causes AGP/v1 issues)
        run: dart run change_app_package_name:main com.kainuwa.alumni

      - name: Ironclad Post-Rename Cleanup (The Ultimate Fix)
        run: |
          # The rename tool breaks the manifests. This Python script on the Ubuntu server fixes them all.
          python3 -c '
          import os, glob, re
          manifests = glob.glob("android/app/src/*/AndroidManifest.xml")
          for m in manifests:
              with open(m, "r") as f:
                  text = f.read()
              
              # 1. Strip the forbidden package attribute
              text = re.sub(r"\s*package=\"[^\"]+\"", "", text)
              
              # 2. Erase old v1 embedding application names
              text = text.replace("android:name=\"io.flutter.app.FlutterApplication\"", "android:name=\"${applicationName}\"")
              
              # 3. Guarantee the v2 embedding tag exists
              if "flutterEmbedding" not in text and "</application>" in text:
                  text = text.replace("</application>", "    <meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />\n    </application>")
              
              with open(m, "w") as f:
                  f.write(text)
          '
          
          # Force the correct namespace in build.gradle
          sed -i 's/namespace .*/namespace "com.kainuwa.alumni"/g' android/app/build.gradle
          
          # Rename the App Label
          sed -i 's/android:label="[^"]*"/android:label="Alumni HYSM"/g' android/app/src/main/AndroidManifest.xml

      - name: Configure Keystore
        run: |
          mv upload-keystore.jks android/app/ || true
          
          cat << EOP > android/key.properties
          storePassword=alumni2026
          keyPassword=alumni2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOP
          
          python3 -c '
          import os
          build_gradle = "android/app/build.gradle"
          if os.path.exists(build_gradle):
              with open(build_gradle, "r") as f:
                  content = f.read()
              if "keystoreProperties" not in content:
                  inject_top = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """
                  sign_config = """
              signingConfigs {
                  release {
                      keyAlias = keystoreProperties["keyAlias"]
                      keyPassword = keystoreProperties["keyPassword"]
                      storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                      storePassword = keystoreProperties["storePassword"]
                  }
              }
          """
                  content = inject_top + content
                  content = content.replace("buildTypes {", sign_config + "\n    buildTypes {")
                  content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
                  with open(build_gradle, "w") as f:
                      f.write(content)
          '

      - name: Build Signed Production APK
        run: flutter build apk --release

      - name: Build Signed Play Store AAB
        run: flutter build appbundle --release

      - name: Upload APK for Direct Download
        uses: actions/upload-artifact@v4
        with:
          name: Alumni_HYSM_Release_APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB for Google Play Store
        uses: actions/upload-artifact@v4
        with:
          name: Alumni_HYSM_PlayStore_AAB
          path: build/app/outputs/bundle/release/app-release.aab
