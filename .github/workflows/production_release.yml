name: Production Release (APK & AAB)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cloud Pre-Build Cleanup (Fix Manifests & Dependencies)
        run: |
          # 1. Inject cupertino_icons and material-design if missing
          python3 -c "
          import os, re
          if os.path.exists('pubspec.yaml'):
              with open('pubspec.yaml', 'r') as f:
                  content = f.read()
              if 'cupertino_icons:' not in content:
                  content = content.replace('dependencies:\n', 'dependencies:\n  cupertino_icons: ^1.0.8\n')
              if 'uses-material-design: true' not in content:
                  content = re.sub(r'flutter:\s+', 'flutter:\n  uses-material-design: true\n  ', content)
              with open('pubspec.yaml', 'w') as f:
                  f.write(content)
          "

          # 2. Fix ALL Android Manifests for v2 embedding & AGP 8.0+
          python3 -c "
          import os, re, glob
          manifests = glob.glob('android/app/src/*/AndroidManifest.xml')
          for manifest in manifests:
              with open(manifest, 'r') as f:
                  content = f.read()
              # Erase the strictly forbidden 'package' attribute
              content = re.sub(r'\s*package=\"[^\"]+\"', '', content)
              # Erase old v1 embedding application names
              content = content.replace('android:name=\"io.flutter.app.FlutterApplication\"', 'android:name=\"\${applicationName}\"')
              # Guarantee the v2 embedding tag exists
              if 'flutterEmbedding' not in content and '<application' in content:
                  content = content.replace('</application>', '    <meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />\n    </application>')
              with open(manifest, 'w') as f:
                  f.write(content)
          "

      - name: Add Required Dev Dependencies Safely
        run: |
          flutter pub add --dev flutter_launcher_icons
          flutter pub add --dev change_app_package_name

      - name: Install All Flutter Dependencies
        run: flutter pub get

      - name: Apply Custom App Icon
        run: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Rename Package
        run: dart run change_app_package_name:main com.kainuwa.alumni

      - name: Configure Keystore and App Name
        run: |
          mv upload-keystore.jks android/app/ || true
          
          cat << EOP > android/key.properties
          storePassword=alumni2026
          keyPassword=alumni2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOP
          
          python3 -c '
          import os
          build_gradle = "android/app/build.gradle"
          if os.path.exists(build_gradle):
              with open(build_gradle, "r") as f:
                  content = f.read()
              if "keystoreProperties" not in content:
                  inject_top = """
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          """
                  sign_config = """
              signingConfigs {
                  release {
                      keyAlias = keystoreProperties["keyAlias"]
                      keyPassword = keystoreProperties["keyPassword"]
                      storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                      storePassword = keystoreProperties["storePassword"]
                  }
              }
          """
                  content = inject_top + content
                  content = content.replace("buildTypes {", sign_config + "\n    buildTypes {")
                  content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
                  with open(build_gradle, "w") as f:
                      f.write(content)
          '
          
          sed -i 's/android:label="[^"]*"/android:label="Alumni HYSM"/g' android/app/src/main/AndroidManifest.xml

      - name: Build Signed Production APK
        run: flutter build apk --release

      - name: Build Signed Play Store AAB
        run: flutter build appbundle --release

      - name: Upload APK for Direct Download
        uses: actions/upload-artifact@v4
        with:
          name: Alumni_HYSM_Release_APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB for Google Play Store
        uses: actions/upload-artifact@v4
        with:
          name: Alumni_HYSM_PlayStore_AAB
          path: build/app/outputs/bundle/release/app-release.aab
