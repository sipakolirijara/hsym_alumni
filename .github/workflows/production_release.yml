name: Production Release (APK & AAB)

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Fix Cupertino Icons Natively
        run: flutter pub add cupertino_icons

      - name: Add Required Dev Dependencies
        run: |
          flutter pub add --dev flutter_launcher_icons
          flutter pub add --dev change_app_package_name
          flutter pub get

      - name: Apply Custom App Icon
        run: dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Rename Package
        run: dart run change_app_package_name:main com.kainuwa.alumni

      - name: Ironclad Post-Rename Cleanup (Format-Aware)
        run: |
          python3 -c '
          import os, glob, re
          
          # Fix Manifests
          for m in glob.glob("android/app/src/*/AndroidManifest.xml"):
              with open(m, "r") as f: text = f.read()
              text = re.sub(r"\s*package=\"[^\"]+\"", "", text)
              text = text.replace("android:name=\"io.flutter.app.FlutterApplication\"", "android:name=\"${applicationName}\"")
              if "flutterEmbedding" not in text and "</application>" in text:
                  text = text.replace("</application>", "    <meta-data android:name=\"flutterEmbedding\" android:value=\"2\" />\n    </application>")
              text = re.sub(r"android:label=\"[^\"]*\"", "android:label=\"Alumni HYSM\"", text)
              with open(m, "w") as f: f.write(text)
              
          # Fix Namespace safely for both Groovy (.gradle) and Kotlin (.kts)
          for g in ["android/app/build.gradle", "android/app/build.gradle.kts"]:
              if os.path.exists(g):
                  with open(g, "r") as f: text = f.read()
                  if "kts" in g:
                      text = re.sub(r"namespace\s*=\s*\"[^\"]+\"", "namespace = \"com.kainuwa.alumni\"", text)
                  else:
                      text = re.sub(r"namespace\s*\"[^\"]+\"", "namespace \"com.kainuwa.alumni\"", text)
                  with open(g, "w") as f: f.write(text)
          '

      - name: Configure Keystore (Format-Aware)
        run: |
          mv upload-keystore.jks android/app/ || true
          
          cat << EOP > android/key.properties
          storePassword=alumni2026
          keyPassword=alumni2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOP
          
          python3 -c '
          import os
          groovy = "android/app/build.gradle"
          kts = "android/app/build.gradle.kts"
          
          if os.path.exists(groovy):
              with open(groovy, "r") as f: content = f.read()
              if "keystoreProperties" not in content:
                  head = "def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file(\"key.properties\")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n"
                  config = "signingConfigs {\n        release {\n            keyAlias = keystoreProperties[\"keyAlias\"]\n            keyPassword = keystoreProperties[\"keyPassword\"]\n            storeFile = keystoreProperties[\"storeFile\"] ? file(keystoreProperties[\"storeFile\"]) : null\n            storePassword = keystoreProperties[\"storePassword\"]\n        }\n    }\n    "
                  content = head + content
                  content = content.replace("buildTypes {", config + "buildTypes {")
                  content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
                  with open(groovy, "w") as f: f.write(content)
                  
          elif os.path.exists(kts):
              with open(kts, "r") as f: content = f.read()
              if "keystoreProperties" not in content:
                  head = "val keystoreProperties = java.util.Properties()\nval keystorePropertiesFile = rootProject.file(\"key.properties\")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))\n}\n"
                  config = "signingConfigs {\n        create(\"release\") {\n            keyAlias = keystoreProperties[\"keyAlias\"] as String\n            keyPassword = keystoreProperties[\"keyPassword\"] as String\n            storeFile = file(keystoreProperties[\"storeFile\"] as String)\n            storePassword = keystoreProperties[\"storePassword\"] as String\n        }\n    }\n    "
                  content = head + content
                  content = content.replace("buildTypes {", config + "buildTypes {")
                  content = content.replace("signingConfig = signingConfigs.getByName(\"debug\")", "signingConfig = signingConfigs.getByName(\"release\")")
                  with open(kts, "w") as f: f.write(content)
          '

      - name: Build Signed Production APK
        run: flutter build apk --release

      - name: Build Signed Play Store AAB
        run: flutter build appbundle --release

      - name: Upload APK for Direct Download
        uses: actions/upload-artifact@v4
        with:
          name: Alumni_HYSM_Release_APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB for Google Play Store
        uses: actions/upload-artifact@v4
        with:
          name: Alumni_HYSM_PlayStore_AAB
          path: build/app/outputs/bundle/release/app-release.aab
