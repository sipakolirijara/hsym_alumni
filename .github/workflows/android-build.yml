name: Production Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean & Setup
        run: |
          rm -rf android
          flutter create --platforms=android --org com.kainuwa .
          flutter pub get

      - name: Enforce Security & Permissions
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Setup Icons
        run: |
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons || true

      - name: Configure Production Keystore (Format-Aware)
        run: |
          cp upload-keystore.jks android/app/ || true
          
          cat << EOP > android/key.properties
          storePassword=alumni2026
          keyPassword=alumni2026
          keyAlias=upload
          storeFile=upload-keystore.jks
          EOP
          
          python3 -c '
          import os
          groovy = "android/app/build.gradle"
          kts = "android/app/build.gradle.kts"
          
          if os.path.exists(groovy):
              with open(groovy, "r") as f: content = f.read()
              if "keystoreProperties" not in content:
                  head = "def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file(\"key.properties\")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n"
                  config = "signingConfigs {\n        release {\n            keyAlias = keystoreProperties[\"keyAlias\"]\n            keyPassword = keystoreProperties[\"keyPassword\"]\n            storeFile = keystoreProperties[\"storeFile\"] ? file(keystoreProperties[\"storeFile\"]) : null\n            storePassword = keystoreProperties[\"storePassword\"]\n        }\n    }\n    "
                  content = head + content
                  content = content.replace("buildTypes {", config + "buildTypes {")
                  content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
                  content = content.replace("signingConfig = signingConfigs.debug", "signingConfig = signingConfigs.release")
                  with open(groovy, "w") as f: f.write(content)
                  
          elif os.path.exists(kts):
              with open(kts, "r") as f: content = f.read()
              if "keystoreProperties" not in content:
                  head = "val keystoreProperties = java.util.Properties()\nval keystorePropertiesFile = rootProject.file(\"key.properties\")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(java.io.FileInputStream(keystorePropertiesFile))\n}\n"
                  config = "    signingConfigs {\n        create(\"release\") {\n            keyAlias = keystoreProperties.getProperty(\"keyAlias\")\n            keyPassword = keystoreProperties.getProperty(\"keyPassword\")\n            storeFile = file(keystoreProperties.getProperty(\"storeFile\"))\n            storePassword = keystoreProperties.getProperty(\"storePassword\")\n        }\n    }\n"
                  content = head + content
                  content = content.replace("buildTypes {", config + "buildTypes {")
                  content = content.replace("signingConfig = signingConfigs.getByName(\"debug\")", "signingConfig = signingConfigs.getByName(\"release\")")
                  with open(kts, "w") as f: f.write(content)
          '

      - name: Build Production Artifacts
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Verify APK Signature Fingerprint
        run: |
          echo "=== AUDIT: EXTRACTING APK SHA-1 ==="
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep SHA1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alumni_HYSM_APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Alumni_HYSM_AAB
          path: build/app/outputs/bundle/release/app-release.aab
