name: Production Build

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean & Setup
        run: |
          rm -rf android
          flutter create --platforms=android --org com.kainuwa .
          flutter pub get

      - name: Enforce Security & Permissions
        run: |
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

      - name: Setup Icons
        run: |
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons || true

      - name: Build Unsigned Artifacts
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Forcefully Sign APK and AAB with Production Keystore
        run: |
          # Locate the Android SDK Build Tools natively on the cloud runner
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          
          echo "=== STRIPPING DEFAULT SIGNATURE ==="
          zip -d build/app/outputs/flutter-apk/app-release.apk META-INF/\* || true
          
          echo "=== ALIGNING APK ==="
          $BUILD_TOOLS/zipalign -v 4 build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-aligned.apk
          
          echo "=== SIGNING APK WITH UPLOAD-KEYSTORE.JKS ==="
          $BUILD_TOOLS/apksigner sign --ks upload-keystore.jks \
            --ks-key-alias upload \
            --ks-pass pass:alumni2026 \
            --key-pass pass:alumni2026 \
            --out build/app/outputs/flutter-apk/Alumni_HYSM_Production.apk \
            build/app/outputs/flutter-apk/app-release-aligned.apk
            
          echo "=== SIGNING AAB WITH UPLOAD-KEYSTORE.JKS ==="
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore upload-keystore.jks \
            -storepass alumni2026 \
            -keypass alumni2026 \
            build/app/outputs/bundle/release/app-release.aab upload
            
          echo "=== FINAL APK SIGNATURE AUDIT ==="
          $BUILD_TOOLS/apksigner verify --print-certs build/app/outputs/flutter-apk/Alumni_HYSM_Production.apk | grep -i "SHA-1" || true

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Alumni_HYSM_APK
          path: build/app/outputs/flutter-apk/Alumni_HYSM_Production.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: Alumni_HYSM_AAB
          path: build/app/outputs/bundle/release/app-release.aab
